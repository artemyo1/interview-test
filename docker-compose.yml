services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-deals_bigdata}
      POSTGRES_USER: ${DB_USER:-logistics}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-logistics}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-deals_bigdata}
      DB_USER: ${DB_USER:-logistics}
      DB_PASSWORD: ${DB_PASSWORD:-logistics}
      AS_OF: ${AS_OF:-2026-10-26}
      N_PRICES: ${N_PRICES:-300000}
      ML_SEED: ${ML_SEED:-42}
      MODEL_DIR: /app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - model_artifacts:/app/artifacts

volumes:
  postgres_data:
  model_artifacts:
